{% extends "base.html" %}
{% block title %}Portal de Empleados{% endblock %}
{% block content %}
  <h1>Portal de Empleados</h1>
  <p class="subtitle">Ingresá con tu usuario y contraseña corporativos</p>

  <form method="POST" class="login-form">
    <label>Usuario
      <input name="username" placeholder="usuario" autofocus autocomplete="off">
    </label>
    <label>Contraseña
      <input name="password" type="text" placeholder="contraseña" autocomplete="off">
    </label>
    <button type="submit">Ingresar</button>
  </form>

  {% if result %}
    <p class="message {{ 'message-ok' if success else 'message-error' }}">{{ result }}</p>
  {% endif %}
{% endblock %}
